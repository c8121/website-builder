<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="{{ Description }}"/>
    <meta name="author" content="https://github.com/c8121/website-builder"/>

    <title>{{ Title }} | {{ SubTitle }}</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico"/>

    <link href="/css/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/app.css" rel="stylesheet"/>

</head>

<body id="page-top">

<!-- Menu-->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">

    <a class="navbar-brand w-75" href="#page-top">
        <h1 class="d-block d-lg-none text-wrap">
            {{ Title }}
            <span class="d-block small fw-light fs-6 text-muted">{{ SubTitle }}</span>
        </h1>
        <span class="d-none d-lg-block">
            <img class="img-fluid rounded-circle mx-auto mb-2" src="{{ Logo }}"
                 alt="{{ Title }} | {{ SubTitle }}"/>
        </span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavMenu"
            aria-controls="mainNavMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavMenu">

        <div class="toc w-100">
            <ul class="navbar-nav">

                <li v-if="Page.Sort == 1" class="nav-item"><a class="nav-link" href="#start">Start</a></li>
                <li v-else class="nav-item"><a class="nav-link" href="/">Startseite</a></li>

                <template v-for="child in Children">
                <li class="nav-item" v-for="child in child.Children"><a class="nav-link" :href="'#' + child.Name">
                    {{ child.Caption | replace("enm", "en&shy;m") | replace("zung", "z&shy;ng") }}</a>
                </li>
                </template>        
            </ul>
        </div>

        <div class="main-nav">
            <ul class="navbar-nav">
                <li class="nav-item" v-for="child in Children" v-if="!child.IsHomePage"><a class="nav-link mobile-only" :href="child.IsHomePage ? '/' : child.Path">{{ child.Name }}</a></li>
            </ul>
        </div>
    </div>
    
    <div class="main-nav">
        <a v-for="child in Children" v-if="!child.IsHomePage" class="small desktop-only text-decoration-none" :href="child.IsHomePage ? '/' : child.Path">{{ child.Name }}</a>
    </div>
</nav>


<!-- Content-->
<div class="container-fluid p-0" id="mainContent">

    <div class="page-content">

        <div class="tpl Text Html">
            <section :id="Meta.Sort == 1 ? 'start' : ''">
                <span v-if="Meta.Sort == 1" class="h1 desktop-only mb-5">
                    {{ Title }}
                    <span class="d-block small fw-light fs-6 text-muted">{{ SubTitle }}</span>
                </span>
                <h2 v-else class="mb-4">{{ Meta.Name }}</h2>
                <div v-if="Meta.ContentType == 'Text'" style="white-space: pre-line">{{ Content.text }}</div>
                <div v-if="Meta.ContentType == 'Html'" v-html="Content.text"></div>
            </section>
            <hr class="m-0" />
        </div>
        
        <div class="tpl Image">
            <a v-if="Content.href" :href="Content.href">
                <div class="text-center"><img :src="Content.src | asset" :alt="Content.alt" :class="Content.class" /></div>
            </a>
            <template v-else>
                <div class="text-center"><img :src="Content.src | asset" :alt="Content.alt" :class="Content.class" /></div>
            </template>
        </div>
        
    </div>

</div>


<!-- Scripts -->
<script src="/css/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>

</body>

</html>
