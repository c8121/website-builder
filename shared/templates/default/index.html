<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="Website Builder Default Template"/>
    <meta name="author" content="c8121"/>

    <title>:) Generates Website</title>

    <style>
        div{
            margin: 5px;
            padding: 5px;
            border: 1px dotted #ccc;
        }
    </style>
    
</head>

<body>

    <div class="main-nav">
        <ul>
            <li v-for="child in Children">
                <a :href="child.Path">{{ child.Name }}</a>
                <ul>
                    <li v-for="child in child.Children">
                        <a :href="child.Path">{{ child.Name }}</a>
                        <ul>
                            <li v-for="child in child.Children">
                                <a :href="child.Path">{{ child.Name }}</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </div>



    <div class="page-content">

        <div class="tpl Text">
            <pre>{{ text }}</pre>
        </div>

        <div class="tpl Image">
            <div>
                <a v-if="href" :href="href">
                    <div><img :src="src | asset" :alt="alt" /></div>
                    <div v-if="alt">{{ alt }}</div>
                </a>
                <template v-else>
                    <div><img :src="src | asset" :alt="alt" /></div>
                    <div v-if="alt">{{ alt }}</div>
                </template>
            </div>
        </div>

    </div>

</body>
</html>
