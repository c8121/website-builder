<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="Website Builder Default Template"/>
    <meta name="author" content="c8121"/>

    <title>:) Website Builder</title>
    
</head>

<body>

    <div class="page-content">

        <div class="tpl Text">
            <pre>{{ text }}</pre>
        </div>

        <div class="tpl Image">
            <div>
                <a v-if="href" :href="href">
                    <div><img :src="src | asset" :alt="alt" /></div>
                    <div v-if="alt">{{ alt }}</div>
                </a>
                <template v-else>
                    <div><img :src="src | asset" :alt="alt" /></div>
                    <div v-if="alt">{{ alt }}</div>
                </template>
            </div>
        </div>

    </div>

</body>
</html>
