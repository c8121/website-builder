<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="Website builder"/>
    <meta name="author" content="c8121"/>

    <title>:) Website Builder</title>
    <link rel="icon" type="image/x-icon" href="ui-assets/favicon.ico"/>

    <link href="css/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/boostrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="css/assets.css" rel="stylesheet"/>
    <link href="css/website-builder.css" rel="stylesheet"/>

    <script type="importmap">
        {
          "imports": {
            "vue": "./js/vue-3.5.41/vue.esm-browser.js",
            "vue-router": "./js/vue-router-5.2.0/vue-router.esm-browser.prod.js"
          }
        }
    </script>

</head>

<body>

<div id="app">

    <div ref="resizeContainer" class="app-with-sidebar">
        <!-- Menu: static sidebar on large screens, off-canvas on small screens -->
        <nav class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" aria-label="Pages">
            <div class="offcanvas-header d-lg-none">
                <span class="offcanvas-title fw-bold">:) Website builder</span>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>

            <div class="offcanvas-body d-block p-3">
                <a class="navbar-brand d-none d-lg-block mb-3" href="#">:) Website builder</a>

                <div class="overflow-x-scroll pb-3">
                    <page-tree ref="pageTree" sortable @component-event="componentEvent"/>
                </div>

                <div class="row mt-lg-4">
                    <div class="col-sm-8 pb-2">
                        <button @click="addPage" class="btn"><i class="bi bi-file-earmark-plus"></i> Add page</button>
                    </div>
                    <div class="col-sm-8 pb-2">
                        <button @click="openConfig" class="btn"><i class="bi bi-sliders"></i> Config</button>
                    </div>
                </div>


            </div>
        </nav>

        <!-- Drag to resize the sidebar (large screens only) -->
        <div class="d-none d-lg-block sidebarResizer" title="Drag to resize"></div>


        <!-- Content-->
        <div class="container-fluid p-0 content">

            <!-- Top bar with menu button (small screens only) -->
            <header class="navbar bg-body-tertiary border-bottom sticky-top d-lg-none px-2">
                <button class="btn btn-open" type="button" data-bs-toggle="offcanvas" aria-label="Menu"><i
                        class="bi bi-list fs-4"></i></button>
                <a class="navbar-brand me-auto" href="#">:) Website builder</a>
            </header>

            <section>

                <router-view v-slot="{ Component }">
                    <component ref="mainView" :is="Component" @component-event="componentEvent"/>
                </router-view>

            </section>
        </div>
    </div>
</div>

<!-- Main App -->
<script type="module">

    import {createApp, ref} from 'vue'
    import {createWebHashHistory, createRouter} from 'vue-router'

    import PageTree from './js/page-tree.vue.js'
    import PageView from './js/page-view.vue.js'
    import PageSelect from './js/page-select.vue.js'
    import PageContentView from './js/page-content-view.vue.js'
    import PageContentList from './js/page-content-list.vue.js'
    import SiteConfigList from './js/site-config-list.vue.js'

    import HrefInput from './js/href-input.vue.js'
    import NeikiEditor from './js/neiki-editor/neiki-editor.vue.js'

    import AssetSelect from './js/asset-select.vue.js'

    import ContainerWithResizer from './js/ui.js'

    const routes = [
        {path: '/page/:id', component: PageView, props: true},
        {path: '/page/new/:parentId', component: PageView, props: true},

        {path: '/content/:id', component: PageContentView, props: true},
        {path: '/content/new/:pageId', component: PageContentView, props: true},

        {path: '/config', component: SiteConfigList, props: true},
    ];

    export const router = createRouter({
        history: createWebHashHistory(),
        routes
    });

    // Small screens: close the off-canvas menu after navigating
    router.afterEach(() => {
        const sidebars = document.getElementsByClassName("sidebar");
        for (const sidebar of sidebars) {
            const offcanvas = sidebar && window.bootstrap && bootstrap.Offcanvas.getInstance(sidebar);
            if (offcanvas)
                offcanvas.hide();
        }
    });


    createApp({

        data() {
            return {
                notifications: []
            }
        },

        methods: {

            componentEvent(eventName, sender) {
                switch (eventName) {

                    case 'pageClick': {
                        const page = arguments[2]
                        location.hash = '/page/' + page.Id;
                        break;
                    }

                    case 'pageSaved': {
                        const page = arguments[2]
                        location.hash = '/page/' + page.Id;
                        this.$refs.pageTree.reload();
                        break;
                    }

                    case 'pageDeleted': {
                        location.hash = '/';
                        this.$refs.pageTree.reload();
                        break;
                    }

                    case 'pageContentClick': {
                        const content = arguments[2]
                        location.hash = '/content/' + content.Id;
                        break;
                    }

                    case 'addContent': {
                        const page = arguments[2]
                        location.hash = '/content/new/' + page.Id;
                        break;
                    }

                    default: {
                        console.log("Event not handled: '" + eventName + "', " + arguments.length + " arguments, sender: " + sender);
                        console.log(arguments);
                    }
                }
            },

            loadNotifications() {
                const self = this;
                const requestOptions = {
                    method: 'GET'
                }
                fetch('/notifications', requestOptions)
                    .then(res => res.json())
                    .then(json => {
                        self.notifications.splice(0, self.notifications.length);
                        for (const msg of json) {
                            self.notifications.push(msg);
                        }
                    });
            },

            addPage() {
                location.hash = '/page/new/0';
            },

            openConfig() {
                location.hash = '/config';
            },

            startSidebarResize(e) {
                UI.startSidebarResize(e);
            }
        },

        mounted() {
            this.loadNotifications();

            ContainerWithResizer.create(this.$refs.resizeContainer)
        }
    })
        .component('page-tree', PageTree)
        .component('page-select', PageSelect)
        .component('page-content-list', PageContentList)
        .component('asset-select', AssetSelect)
        .component('href-input', HrefInput)
        .component('neiki-editor', NeikiEditor)
        .use(router)
        .mount('#app');

</script>

<!-- UI Scripts -->
<script src="css/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/neiki-editor/neiki-editor.min.js"></script>

</body>
</html>
